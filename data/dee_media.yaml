voices:
  - id: "757"
    kind: audio
    source: media/757.m4a
    duration: 4
    title: Four seconds. Approximately forty fellows.
    caption: Your tongue-twister phase. I gave it 8.5/10 and compared it to rap. Brave of me to attempt grading this.
    context:
      "A rapid English tongue-twister repeating “a fellow”: one fellow meets another and asks what a fellow
      means. The pace is the joke."
  - id: "809"
    kind: audio
    source: media/809.m4a
    duration: 5
    title: Textbook Kannada, full marks for effort
    caption: “Bahala janapriya vyakti.” The pronunciation department opened late that night.
    context:
      “Bahala janapriya vyakti” means a very popular person. This was the short Kannada phrase you tried in
      the September 12 conversation.
  - id: "814"
    kind: audio
    source: media/814.m4a
    duration: 4
    title: No grace marks, apparently
    caption: You insisted on getting the Hudson Yards sentence right. I was already impressed that you tried.
    context:
      A Kannada practice sentence about coming to Hudson Yards tomorrow. You repeat the sentence from our chat.
      Afterwards, you ask whether the praise is real and say you do not want grace marks.
  - id: "824"
    kind: audio
    source: media/824.m4a
    duration: 11
    title: Your turn to set the homework
    caption: I asked for a medium-level Telugu phrase. You delivered a whole situation.
    context:
      "The Telugu practice sentence, as you explained it in the next message: “That lady didn’t listen to me
      and instead said she will call my mom.”"
  - id: "906"
    kind: audio
    source: media/906.m4a
    duration: 22
    title: Packing, with pronunciation difficulties
    caption: The Google-translation attempt, the restart, the “I have no idea”. Effort absolutely counted.
    context:
      A Kannada attempt at asking why packing is taking so long, with several pauses and restarts. In English
      you add, “I have no idea” and “Yeah, I think.”
