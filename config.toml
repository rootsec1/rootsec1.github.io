baseURL = "https://abhishekmurthy.com/"
title = "Abhishek Murthy"
theme = "hugo-coder"
languageCode = "en-us"
defaultcontentlanguage = "en"
contentDir = "content"
pluralizelisttitles = false
googleAnalytics = "G-2NZGH53V36"
enableRobotsTXT = true

paginate = 30

[pagination]
    pagerSize = 30

[outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true

[outputs]
    home = ["HTML", "RSS", "LLMS"]

[markup.highlight]
    style = "github-dark"

[params]
    author = "Abhishek Murthy"
    info = "Founding Engineer at ProSights"
    description = "Abhishek Murthy builds AI agents, document extraction systems, and backend infrastructure. Read about his engineering work at ProSights, Ticketdude, and Blinkit."
    avatarurl = "/images/abhishek-murthy.jpg"
    images = ["/images/abhishek-murthy-social.png"]
    enableTwemoji = true
    colorScheme = "auto"
    hidecolorschemetoggle = false
    dateFormat = "January 2, 2006"
    favicon_16 = "/images/favicon-16x16.png"
    favicon_32 = "/images/favicon-32x32.png"
    touchIcon = "/images/apple-touch-icon.png"
    customCSS = ["css/pagination.css", "css/profile.css"]

[taxonomies]
    category = "categories"
    series = "series"
    tag = "tags"
    author = "authors"

